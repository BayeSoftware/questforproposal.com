<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest</title>
<meta name="description" content="Quest is coming soon.">
<meta name="theme-color" content="#224574">
<link rel="preload" href="fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="hero.webp" as="image" type="image/webp">
<style>
@font-face{font-family:'Newsreader';font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/newsreader.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/instrumentsans.woff2) format('woff2')}
*{box-sizing:border-box}
html{background:#80bbf2}
body{margin:0;min-height:100vh;min-height:100svh;position:relative;overflow:hidden;display:grid;justify-items:center;align-content:start;padding:clamp(56px,14vh,160px) 24px 0;background:#80bbf2;color:#fff;font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
/* the coast sits along the bottom edge and its sky carries on up the page */
body::before{content:"";position:absolute;left:0;right:0;bottom:0;height:max(42.4vw,434px);background:url(hero.webp) 35% bottom/max(100%,1024px) auto no-repeat;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%);mask-image:linear-gradient(180deg,transparent 0,#000 16%)}
body::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,36,80,.78) 0,rgba(8,36,80,.62) 30%,rgba(8,36,80,0) 60%)}
main{position:relative;z-index:1;text-align:center}
h1{margin:0;display:inline-flex;align-items:center;gap:.36em;font:500 clamp(48px,12vw,88px)/1 'Newsreader',Georgia,'Times New Roman',serif;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(10,50,120,.3)}
.mark{flex:none;width:.8em;height:.8em;border-radius:50%;background:#fff;position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;left:-18%;right:-18%;bottom:-41%;height:73%;border-radius:50%;background:#4fae55}
p{margin:22px 0 0;font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#e6f1fc}
@media (max-height:560px){body{padding-top:36px}h1{font-size:56px}p{margin-top:12px}}
</style>
</head>
<body>
<main>
<h1><span class="mark" aria-hidden="true"></span>Quest</h1>
<p>Coming soon</p>
</main>
</body>
</html>
